<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>X Likes Shortcut</title>
<style>
  :root { --fg: #0f1419; --sub: #6b7680; --line: #e6e9ec; --accent: #0f1419; --bg: #fff; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #e7e9ea; --sub: #8b98a5; --line: #2f3336; --accent: #e7e9ea; --bg: #000; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; width: 280px; padding: 16px 18px 14px; background: var(--bg); color: var(--fg);
    font: 13px/1.5 -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif; }
  h1 { margin: 0 0 2px; font-size: 14px; font-weight: 700; letter-spacing: .02em; }
  p { margin: 0 0 10px; color: var(--sub); font-size: 12px; }
  label { display: flex; align-items: center; justify-content: space-between; padding: 7px 0;
    border-top: 1px solid var(--line); cursor: pointer; }
  label:last-of-type { border-bottom: 1px solid var(--line); }
  input { appearance: none; width: 30px; height: 18px; margin: 0; border-radius: 9px; background: var(--line);
    position: relative; cursor: pointer; transition: background .15s; flex: none; }
  input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%;
    background: var(--bg); transition: transform .15s; }
  input:checked { background: var(--accent); }
  input:checked::after { transform: translateX(12px); }
  .foot { margin-top: 10px; display: flex; justify-content: space-between; color: var(--sub); font-size: 12px; }
  button { all: unset; cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>
  <h1>サイドバーに表示する項目</h1>
  <p>オフにした項目は左サイドバーから隠れます。</p>
  <div id="list"></div>
  <div class="foot"><button id="reset">初期設定に戻す</button><span>変更は即時反映</span></div>
  <script src="items.js"></script>
  <script src="popup.js"></script>
</body>
</html>
